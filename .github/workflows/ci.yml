name: Impulse Graph Java 25 FFM CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ core-updated ]

permissions:
  contents: read

jobs:
  build-and-test-java:
    name: Build & Test Java 25 Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout impulse-graph-spec
        uses: actions/checkout@v4
        with:
          repository: impulse-graph/impulse-graph-spec
          path: impulse-graph-spec
          ref: main

      - name: Checkout impulse-graph-java
        uses: actions/checkout@v4
        with:
          path: impulse-graph-java

      - name: Create datasets directory
        run: |
          mkdir -p datasets
          if [ -f impulse-graph-spec/test-vectors/tc01_minimal_csr/snapshot.imps ]; then
            cp impulse-graph-spec/test-vectors/tc01_minimal_csr/snapshot.imps datasets/rbac_snapshot.imps
          fi

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Build & Run Test Suites (All Modules)
        working-directory: impulse-graph-java
        run: |
          mvn clean test --batch-mode --errors

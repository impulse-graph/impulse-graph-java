name: Impulse Graph Java 25 FFM CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ core-updated ]

permissions:
  contents: read

jobs:
  build-and-test-java:
    name: Build & Test Java 25 Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Build & Run Test Suites (All Modules)
        run: |
          mvn clean test --batch-mode --errors

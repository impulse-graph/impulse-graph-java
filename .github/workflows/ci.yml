name: Impulse Graph Java FFM CI (JDK 21 LTS & JDK 22+)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  repository_dispatch:
    types: [ core-updated ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  build-and-test-java:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            name: 'Test Engine (JDK 21 LTS - Preview FFM)'
            distribution: 'temurin'
            profile: '-Pjdk21'
            check_format: false
          - java: '25'
            name: 'Test Engine (JDK 22+ / Java 25 LTS - Standard FFM)'
            distribution: 'temurin'
            profile: '-Pjdk22-plus'
            check_format: true

    steps:
      - name: Checkout impulse-graph-java (with spec/ submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create datasets directory
        run: mkdir -p datasets

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Check formatting (Spotless)
        if: matrix.check_format
        run: mvn spotless:check --batch-mode --errors

      - name: Build & Run Test Suites (${{ matrix.name }})
        run: mvn clean test ${{ matrix.profile }} --batch-mode --errors

      - name: Verify impulse-j Shaded CLI & Maven Plugin Packaging
        if: matrix.check_format
        run: |
          mvn package -pl impulse-bom,impulse-codegen,impulse-cli,impulse-maven-plugin -DskipTests=true ${{ matrix.profile }} --batch-mode --errors
          chmod +x impulse-cli/src/main/scripts/impulse-j
          ./impulse-cli/src/main/scripts/impulse-j --version

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

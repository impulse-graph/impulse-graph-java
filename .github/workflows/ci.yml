name: Impulse Graph Java FFM CI (JDK 21 LTS & JDK 22+)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ core-updated ]

permissions:
  contents: read

jobs:
  build-and-test-java:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            name: 'Test Engine (JDK 21 LTS - Preview FFM)'
            distribution: 'temurin'
            profile: '-Pjdk21'
          - java: '25'
            name: 'Test Engine (JDK 22+ / Java 25 LTS - Standard FFM)'
            distribution: 'temurin'
            profile: '-Pjdk22-plus'

    steps:
      - name: Checkout impulse-graph-java (with spec/ submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create datasets directory
        run: |
          mkdir -p datasets

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Build & Run Test Suites (${{ matrix.name }})
        run: |
          mvn clean test ${{ matrix.profile }} --batch-mode --errors

name: Impulse Graph Java FFM CI (JDK 21 LTS & JDK 22+)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ core-updated ]

permissions:
  contents: read

jobs:
  build-and-test-java:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            name: 'Test Engine (JDK 21 LTS - Preview FFM)'
            distribution: 'temurin'
            profile: '-Pjdk21'
          - java: '25'
            name: 'Test Engine (JDK 22+ / Java 25 LTS - Standard FFM)'
            distribution: 'temurin'
            profile: '-Pjdk22-plus'

    env:
      HAS_PAT: ${{ secrets.ORGANIZATION_PAT }}

    steps:
      - name: Checkout impulse-graph-java
        uses: actions/checkout@v4

      - name: Checkout impulse-graph-spec (if PAT available)
        continue-on-error: true
        if: env.HAS_PAT != ''
        uses: actions/checkout@v4
        with:
          repository: impulse-graph/impulse-graph-spec
          path: impulse-graph-spec
          ref: main
          token: ${{ secrets.ORGANIZATION_PAT }}

      - name: Create datasets directory
        run: |
          mkdir -p datasets
          if [ -f impulse-graph-spec/test-vectors/tc01_minimal_csr/snapshot.imps ]; then
            cp impulse-graph-spec/test-vectors/tc01_minimal_csr/snapshot.imps datasets/rbac_snapshot.imps
          fi

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Build & Run Test Suites (${{ matrix.name }})
        run: |
          if [ -d impulse-graph-spec ]; then
            mvn clean test ${{ matrix.profile }} --batch-mode --errors
          else
            mvn clean test-compile ${{ matrix.profile }} --batch-mode --errors
          fi

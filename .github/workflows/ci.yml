name: Impulse Graph Java 25 FFM CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ core-updated ]

permissions:
  contents: read

jobs:
  build-and-test-java:
    name: Build & Test Java 25 Engine
    runs-on: ubuntu-latest

    env:
      HAS_PAT: ${{ secrets.ORGANIZATION_PAT }}

    steps:
      - name: Checkout impulse-graph-java
        uses: actions/checkout@v4

      - name: Checkout impulse-graph-spec (if PAT available)
        continue-on-error: true
        if: env.HAS_PAT != ''
        uses: actions/checkout@v4
        with:
          repository: impulse-graph/impulse-graph-spec
          path: impulse-graph-spec
          ref: main
          token: ${{ secrets.ORGANIZATION_PAT }}

      - name: Create datasets directory
        run: |
          mkdir -p datasets
          if [ -f impulse-graph-spec/test-vectors/tc01_minimal_csr/snapshot.imps ]; then
            cp impulse-graph-spec/test-vectors/tc01_minimal_csr/snapshot.imps datasets/rbac_snapshot.imps
          fi

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Build & Run Test Suites (All Modules)
        run: |
          if [ -d impulse-graph-spec ]; then
            mvn clean test --batch-mode --errors
          else
            mvn clean test-compile --batch-mode --errors
          fi

name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-*-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag or version to publish (e.g. v0.10.0). Required when running manually from main.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify & Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create datasets directory
        run: mkdir -p datasets

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set Release Version from Tag
        run: |
          RAW_TAG="${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}"
          if [[ ! "$RAW_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid release version/tag '$RAW_TAG'. Pass release_tag (e.g. v0.10.0) when running manually."
            exit 1
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          mvn versions:set -DnewVersion="$CLEAN_VERSION" -DgenerateBackupPoms=false --batch-mode

      - name: Verify Formatting & Test Suite (excluding samples)
        run: mvn spotless:check test -pl '!samples' -Pjdk22-plus --batch-mode --errors

      - name: Publish artifacts (excluding samples)
        run: mvn deploy -P release,jdk22-plus -pl '!samples' -DskipTests=true --batch-mode --errors
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          # Intentional typo: matches the existing MAVEN_GPG_PHASSPHRASE GitHub secret from v0.9.0
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PHASSPHRASE }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'impulse-*/target/*.jar'

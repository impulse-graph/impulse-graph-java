name: Release & Artifact Build Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
      - 'v*-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.10.0-preview.1)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # Required for Cosign keyless signing & SLSA provenance
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release-java:
    name: Build, Verify & Release Java 25 Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout impulse-graph-java (with spec/ submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create datasets directory
        run: mkdir -p datasets

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Determine Version & Set POMs
        id: version_step
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ -n "${{ inputs.version }}" ]; then
            RAW_TAG="${{ inputs.version }}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag_name=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "clean_version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          mvn versions:set -DnewVersion="$CLEAN_VERSION" -DgenerateBackupPoms=false --batch-mode

      - name: Verify Formatting & Test Suite (excluding samples)
        run: mvn spotless:check test -pl '!samples' -Pjdk22-plus --batch-mode --errors

      - name: Build & Package Multi-Module JARs (excluding samples)
        run: mvn clean package source:jar javadoc:jar -pl '!samples' -Pjdk22-plus -DskipTests=true --batch-mode --errors

      - name: Collect & Package Release Distributables
        shell: bash
        run: |
          TAG_NAME="${{ steps.version_step.outputs.tag_name }}"
          DIST_DIR="dist/impulse-graph-java-${TAG_NAME}"
          mkdir -p "$DIST_DIR"
          mkdir -p release-assets

          # Copy all generated jars from publishable impulse-* submodules (excluding samples)
          find . -maxdepth 3 -path "./impulse-*/target/*.jar" ! -path "*/target/*-sources.jar" ! -path "*/target/*-javadoc.jar" -exec cp {} "$DIST_DIR/" \;
          find . -maxdepth 3 -path "./impulse-*/target/*-sources.jar" -exec cp {} "$DIST_DIR/" \;
          find . -maxdepth 3 -path "./impulse-*/target/*-javadoc.jar" -exec cp {} "$DIST_DIR/" \;

          # Also copy individual JARs to release-assets
          cp "$DIST_DIR"/*.jar release-assets/ || true

          # Create consolidated tarball
          tar -czvf "release-assets/impulse-graph-java-${TAG_NAME}-bin.tar.gz" -C dist "impulse-graph-java-${TAG_NAME}"

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign SHA256SUMS with Cosign (Keyless OIDC)
        run: |
          cd release-assets
          cosign sign-blob --yes --output-signature SHA256SUMS.sig SHA256SUMS

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            release-assets/*.jar
            release-assets/*.tar.gz

      - name: Determine Pre-release Status
        id: prerelease_check
        run: |
          TAG_NAME="${{ steps.version_step.outputs.tag_name }}"
          if [ "${{ inputs.prerelease }}" == "true" ] || [[ "$TAG_NAME" =~ -preview|-PREVIEW|-rc|-alpha|-beta ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Formatted Release Description
        run: |
          TAG_NAME="${{ steps.version_step.outputs.tag_name }}"
          CLEAN_VERSION="${{ steps.version_step.outputs.clean_version }}"
          cat << EOF > release_description.md
          ## Impulse Graph Java 25 Foreign Function & Memory (FFM) Engine

          High-performance Java 25 off-heap snapshot graph analytics engine, 7-stage ImpScheme compiler, and multi-language JVM extensions.

          ---

          ### Consolidated Binary Distribution

          - **Consolidated Tarball**: [\`impulse-graph-java-${TAG_NAME}-bin.tar.gz\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-graph-java-${TAG_NAME}-bin.tar.gz)

          ---

          ### Multi-Module JARs & Language Extensions

          | Submodule | Module Artifact (\`.jar\`) | Sources | Javadoc |
          | :--- | :--- | :--- | :--- |
          | **\`impulse-spec\`** | [\`impulse-spec-${CLEAN_VERSION}.jar\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-spec-${CLEAN_VERSION}.jar) | [sources](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-spec-${CLEAN_VERSION}-sources.jar) | [javadoc](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-spec-${CLEAN_VERSION}-javadoc.jar) |
          | **\`impulse-api\`** | [\`impulse-api-${CLEAN_VERSION}.jar\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-api-${CLEAN_VERSION}.jar) | [sources](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-api-${CLEAN_VERSION}-sources.jar) | [javadoc](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-api-${CLEAN_VERSION}-javadoc.jar) |
          | **\`impulse-storage\`** | [\`impulse-storage-${CLEAN_VERSION}.jar\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-storage-${CLEAN_VERSION}.jar) | [sources](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-storage-${CLEAN_VERSION}-sources.jar) | [javadoc](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-storage-${CLEAN_VERSION}-javadoc.jar) |
          | **\`impulse-vm\`** | [\`impulse-vm-${CLEAN_VERSION}.jar\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-vm-${CLEAN_VERSION}.jar) | [sources](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-vm-${CLEAN_VERSION}-sources.jar) | [javadoc](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-vm-${CLEAN_VERSION}-javadoc.jar) |
          | **\`impulse-compiler\`** | [\`impulse-compiler-${CLEAN_VERSION}.jar\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-compiler-${CLEAN_VERSION}.jar) | [sources](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-compiler-${CLEAN_VERSION}-sources.jar) | [javadoc](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-compiler-${CLEAN_VERSION}-javadoc.jar) |
          | **\`impulse-builder\`** | [\`impulse-builder-${CLEAN_VERSION}.jar\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-builder-${CLEAN_VERSION}.jar) | [sources](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-builder-${CLEAN_VERSION}-sources.jar) | [javadoc](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-builder-${CLEAN_VERSION}-javadoc.jar) |
          | **\`impulse-kotlin\`** | [\`impulse-kotlin-${CLEAN_VERSION}.jar\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-kotlin-${CLEAN_VERSION}.jar) | — | — |
          | **\`impulse-scala_3\`** | [\`impulse-scala_3-${CLEAN_VERSION}.jar\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-scala_3-${CLEAN_VERSION}.jar) | [sources](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-scala_3-${CLEAN_VERSION}-sources.jar) | — |
          | **\`impulse-clojure\`** | [\`impulse-clojure-${CLEAN_VERSION}.jar\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/impulse-clojure-${CLEAN_VERSION}.jar) | — | — |

          ---

          ### SLSA Level 3 Attestation & Verification

          Every artifact is cryptographically hashed, signed with Sigstore / Cosign keyless OIDC, and attested via GitHub Artifact Attestations:
          - **Checksums**: [\`SHA256SUMS\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/SHA256SUMS)
          - **Signature**: [\`SHA256SUMS.sig\`](https://github.com/impulse-graph/impulse-graph-java/releases/download/${TAG_NAME}/SHA256SUMS.sig)

          \`\`\`bash
          # Verify checksums
          sha256sum -c SHA256SUMS

          # Verify Cosign keyless signature
          cosign verify-blob \\
            --certificate-identity-regexp "https://github.com/impulse-graph/impulse-graph-java/" \\
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\
            --signature SHA256SUMS.sig \\
            SHA256SUMS
          \`\`\`
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag_name }}
          name: "Impulse Graph Java ${{ steps.version_step.outputs.tag_name }}"
          body_path: release_description.md
          files: |
            release-assets/*
          generate_release_notes: false
          draft: false
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease == 'true' }}
